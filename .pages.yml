# Panel de administración: https://app.pagescms.org
# Cada cambio guardado en el panel se publica solo en optoservicenic.com en 1-2 minutos.

media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: promociones
    label: Promociones del mes
    type: file
    path: content/promociones.json
    format: json
    fields:
      - name: promociones
        label: Promociones
        type: object
        list: true
        description: Se muestran en este orden. Las vencidas desaparecen solas de la web.
        fields:
          - name: activa
            label: Mostrar en la web
            type: boolean
            default: true
          - name: imagen
            label: Imagen o flyer
            type: image
            description: Cuadrada o vertical, como las de Instagram.
          - name: titulo
            label: Título
            type: string
            description: "Ej.: Examen visual + lentes completos"
          - name: precio
            label: Precio u oferta
            type: string
            description: "Ej.: C$ 1,500 · 2x1 · 20% de descuento"
          - name: descripcion
            label: Descripción
            type: text
          - name: vence
            label: Válida hasta
            type: date
            description: Al día siguiente deja de mostrarse. Déjalo vacío si no tiene fecha de fin.
          - name: mensaje
            label: Mensaje de WhatsApp
            type: string
            description: Opcional. Si lo dejas vacío se envía "Me interesa la promoción" con el título.

  - name: fotos-portada
    label: "Fotos · Portada"
    type: file
    path: content/fotos-portada.json
    format: json
    fields:
      - name: segundos
        label: Segundos entre fotos
        type: number
        default: 5
        description: Cada cuánto cambia la foto si hay más de una (entre 3 y 20). Quien visita la página también puede pausarlas.
      - name: fotos
        label: "Fotos de la portada"
        type: object
        list: true
        description: "La foto grande de arriba. Si hay más de una, rotan solas. Se ve vertical en celular y computadora, y horizontal en tablet: deja lo importante cerca del centro. Revisa cómo queda en optoservicenic.com/vista-previa.html"
        fields:
          - name: imagen
            label: Foto
            type: image
            required: true
            description: Lo ideal es 1200 px de ancho o más. Las fotos del celular sirven tal como salen.
          - name: descripcion
            label: Descripción de la foto
            type: string
            description: Qué se ve en la foto. Ayuda a personas con discapacidad visual y a Google.
          - name: etiqueta
            label: Etiqueta del recuadro
            type: string
            description: "Opcional. Texto corto en mayúsculas sobre la foto. Ej.: Terapia visual"
          - name: texto
            label: Texto del recuadro
            type: string
            description: "Opcional. Una línea corta. Ej.: Ortóptica para estrabismo, ambliopía y convergencia. Si dejas etiqueta y texto vacíos, la foto va sin recuadro."
          - name: enlace
            label: Al tocar el recuadro
            type: select
            description: Opcional. Qué pasa cuando alguien toca el recuadro de texto. Si lo dejas vacío, el recuadro no lleva a ningún lado.
            options:
              values:
                - { value: agendar, label: "Abrir «Agendar cita»" }
                - { value: "agendar:Examen visual completo", label: "Abrir «Agendar cita» con Examen visual completo elegido" }
                - { value: "agendar:Terapia visual", label: "Abrir «Agendar cita» con Terapia visual elegido" }
                - { value: "agendar:Optometría pediátrica", label: "Abrir «Agendar cita» con Optometría pediátrica elegido" }
                - { value: "agendar:Lentes oftálmicos", label: "Abrir «Agendar cita» con Lentes oftálmicos elegido" }
                - { value: "agendar:Lentes de contacto", label: "Abrir «Agendar cita» con Lentes de contacto elegido" }
                - { value: "agendar:Atención oftalmológica", label: "Abrir «Agendar cita» con Atención oftalmológica elegido" }
                - { value: "#servicios", label: "Ir a la sección Servicios" }
                - { value: "#examen", label: "Ir a la sección Examen visual" }
                - { value: "#nosotros", label: "Ir a la sección Nosotros" }
                - { value: "#senales", label: "Ir a la sección ¿Cuándo revisarte?" }
                - { value: "#sucursales", label: "Ir a la sección Sucursales" }
                - { value: "#promociones", label: "Ir a la sección Promociones" }
                - { value: "#faq", label: "Ir a la sección Preguntas frecuentes" }
                - { value: "#empresas", label: "Ir a la sección Para empresas" }
                - { value: "#contacto", label: "Ir a la sección Contacto" }
          - name: enfoque
            label: Parte de la foto que siempre debe verse
            type: select
            description: La foto se recorta distinto en celular y en computadora. Elige dónde está lo importante (por ejemplo, la cara). Revisa el resultado en optoservicenic.com/vista-previa.html
            options:
              values:
                - { value: arriba-izquierda, label: Arriba a la izquierda }
                - { value: arriba, label: Arriba (caras) }
                - { value: arriba-derecha, label: Arriba a la derecha }
                - { value: izquierda, label: Izquierda }
                - { value: centro, label: Centro }
                - { value: derecha, label: Derecha }
                - { value: abajo-izquierda, label: Abajo a la izquierda }
                - { value: abajo, label: Abajo }
                - { value: abajo-derecha, label: Abajo a la derecha }
          - name: ajuste
            label: Cómo llenar el espacio
            type: select
            description: "Llenar: la foto cubre todo el espacio y se recortan los bordes. Mostrar completa: no se recorta nada y sobra un margen color lino (útil para fotos de producto o con texto)."
            options:
              values:
                - { value: llenar, label: Llenar el espacio (recorta los bordes) }
                - { value: completa, label: Mostrar completa (sin recortar) }
          - name: desde
            label: Mostrar desde
            type: date
            description: Opcional. Para fotos de temporada (Navidad, regreso a clases). Antes de esta fecha la foto no se muestra.
          - name: hasta
            label: Mostrar hasta
            type: date
            description: Opcional. Al día siguiente la foto deja de mostrarse sola.

