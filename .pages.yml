          - name: lunes_viernes
            label: Lunes a viernes
            type: object
            fields:
              - { name: abre, label: "Abre (HH:MM, 24 h)", type: string, required: true }
              - { name: cierra, label: "Cierra (HH:MM, 24 h)", type: string, required: true }
          - name: sabado
            label: Sábado
            type: object
            fields:
              - { name: abre, label: "Abre (HH:MM, 24 h)", type: string, required: true }
              - { name: cierra, label: "Cierra (HH:MM, 24 h)", type: string, required: true }
